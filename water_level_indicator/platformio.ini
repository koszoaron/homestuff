; Water Level Indicator -- ATmega168-20PU (inventory MCU-02), MiniCore.
; See CLAUDE.md for the reasoning behind every setting here; the fuse and
; bootloader choices in particular are settled decisions, not defaults.

[platformio]
default_envs = uno_isp

[env]
platform = atmelavr
framework = arduino
board = ATmega168
board_build.f_cpu = 8000000L
board_build.variant = standard

board_hardware.oscillator = internal
board_hardware.uart = no_bootloader
board_hardware.bod = 2.7v
board_hardware.eesave = yes

; No -Werror on purpose: the Arduino core headers warn, and failing the
; build on that is pure friction.
build_flags = -Wall

; --- Arduino UNO running the stock ArduinoISP sketch ---
; Note the 3.3 V warning in CLAUDE.md before using this in circuit.
[env:uno_isp]
upload_protocol = stk500v1
upload_port = /dev/ttyACM0          ; adjust
board_upload.speed = 19200          ; ArduinoISP's own baud rate
; -e forces an explicit chip erase. avrdude's auto-erase does not reliably
; fire through ArduinoISP on this target: without it, writes land on
; non-erased flash and verify fails deterministically (old AND new).
upload_flags =
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED
    -e

; --- Bus Pirate as ISP (preferred: native 3.3 V logic) ---
[env:buspirate]
upload_protocol = buspirate
upload_port = /dev/ttyUSB0          ; adjust
